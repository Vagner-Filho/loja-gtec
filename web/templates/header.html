{{ define "header" }}
<header class="glass-dark header-sticky text-white">
  <div class="container mx-auto px-4">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <a href="/" class="hidden md:flex items-center gap-2 group">
        <div class="w-9 h-9 rounded-lg flex items-center justify-center group-hover:bg-white/20 transition-colors duration-300">
          <img src="/static/images/logo_transparent.png" class="size-5" />
        </div>
        <span class="text-xl font-bold tracking-tight">Loja
          <span class="text-blue-200">G-TEC</span></span>
      </a>
      <!-- Search Component -->
      <div class="relative hidden sm:flex items-center gap-3" id="search-container">
        <input type="text" id="search-input" name="q" placeholder="Buscar produtos..." class="w-56 lg:w-96 px-4 py-2 pl-10 rounded-full bg-white/10 border border-white/20 text-white placeholder-white/60 text-sm focus:outline-none focus:bg-white/20 focus:border-white/40 transition-all duration-300" hx-get="/api/search" hx-trigger="keyup changed delay:200ms" hx-target="#search-results" hx-swap="innerHTML" hx-indicator="#search-loading" hx-on:focus="document.getElementById('search-results').classList.remove('hidden')" autocomplete="off">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 absolute left-3.5 top-1/2 transform -translate-y-1/2 text-white/60" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <div id="search-loading" class="htmx-indicator absolute right-3 top-1/2 transform -translate-y-1/2">
          <svg class="animate-spin h-4 w-4 text-white/70" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
            </path>
          </svg>
        </div>
        <div id="search-results" class="hidden search-dropdown absolute top-full left-0 right-0 mt-2 rounded-xl border border-gray-100 max-h-96 overflow-y-auto z-50">
        </div>
        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center gap-1">
          <a href="#contact" class="px-4 py-2 rounded-lg text-sm font-medium hover:bg-white/10 transition-all duration-200">Contato</a>
        </nav>
      </div>
      <!-- Search & Cart -->
      <div class="flex items-center gap-3">
        <!-- Cart Icon -->
        <div class="relative flex items-center gap-4">
          <!-- Mobile Menu Button -->
          <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg hover:bg-white/10 transition-all duration-200" aria-label="Menu" aria-expanded="false">
            <svg id="menu-icon-open" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
            <svg id="menu-icon-close" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
          <!-- Mobile Search (visible only on mobile) -->
          <div class="sm:hidden">
            <div class="relative" id="search-container-mobile">
              <input type="text" id="search-input-mobile" name="q" placeholder="Buscar produtos..." class="w-full px-4 py-2 pl-10 rounded-full bg-white/10 border border-white/20 text-white placeholder-white/60 text-sm focus:outline-none focus:bg-white/20 focus:border-white/40 transition-all duration-300" hx-get="/api/search" hx-trigger="keyup changed delay:200ms" hx-target="#search-results-mobile" hx-swap="innerHTML" hx-indicator="#search-loading-mobile" hx-on:focus="document.getElementById('search-results-mobile').classList.remove('hidden')" autocomplete="off">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 absolute left-3.5 top-1/2 transform -translate-y-1/2 text-white/60" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
              <div id="search-loading-mobile" class="htmx-indicator absolute right-3 top-1/2 transform -translate-y-1/2">
                <svg class="animate-spin h-4 w-4 text-white/70" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                  </path>
                </svg>
              </div>
              <div id="search-results-mobile" class="hidden search-dropdown absolute top-full left-0 right-0 mt-2 rounded-xl border border-gray-100 max-h-96 overflow-y-auto z-50">
              </div>
            </div>
          </div>
          <button id="cart-icon" class="p-2 rounded-lg hover:bg-white/10 transition-all duration-200 relative group" hx-get="/cart-modal" hx-target="#cart-container" hx-swap="innerHTML" hx-trigger="click once">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
            <span id="cart-badge" class="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center opacity-0 transition-opacity duration-300">0</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
<!-- Mobile Menu Overlay -->
<div id="mobile-menu-overlay" class="fixed inset-0 bg-black/30 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>
<!-- Mobile Menu -->
<nav id="mobile-menu" class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 ease-in-out">
  <div class="p-6">
    <div class="flex justify-between items-center mb-8">
      <span class="text-xl font-bold text-gray-800">Menu</span>
      <button id="mobile-menu-close" class="p-2 rounded-lg hover:bg-gray-100 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <div class="space-y-2">
      <a href="/" class="block px-4 py-3 rounded-lg text-gray-700 font-medium hover:bg-blue-50 hover:text-blue-600 transition-colors">Home</a>
      <a href="#product-type-selection" class="block px-4 py-3 rounded-lg text-gray-700 font-medium hover:bg-blue-50 hover:text-blue-600 transition-colors">Produtos</a>
      <a href="#" class="block px-4 py-3 rounded-lg text-gray-700 font-medium hover:bg-blue-50 hover:text-blue-600 transition-colors">Serviços</a>
      <a href="#" class="block px-4 py-3 rounded-lg text-gray-700 font-medium hover:bg-blue-50 hover:text-blue-600 transition-colors">Contato</a>
    </div>
    <div class="mt-8 pt-6 border-t border-gray-200">
      <p class="text-sm text-gray-500 mb-4">Atendimento</p>
      <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-teal-600 text-white font-medium hover:bg-teal-700 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        </svg>
        Fale Conosco
      </a>
    </div>
  </div>
</nav>
{{ end }}
