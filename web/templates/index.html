<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja G-TEC Multimarcas - Purificadores, Bebedouros e Refis</title>
    <meta name="description" content="Loja G-TEC Multimarcas - Especialista em purificadores de água, bebedouros, refis e peças. Produtos de qualidade para sua casa e empresa.">
    <!--<link href="/static/images/favicon.png" type="image/x-icon" rel="icon">-->
    <link href="/static/fonts/inter/inter.css" rel="stylesheet">
    <link href="/static/css/dist/style.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="/static/images/favicon-96x96.png" sizes="96x96" >
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg" >
    <link rel="shortcut icon" href="/static/images/favicon.ico" >
    <link rel="apple-touch-icon" sizes="180x180" href="/static/images/apple-touch-icon.png" >
    <meta name="apple-mobile-web-app-title" content="G-TEC" >
    <link rel="manifest" href="/static/images/site.webmanifest" >
    <script src="/static/js/vendor/htmx.min.js.gz"></script>
  </head>
  <body class="bg-gradient-to-br from-slate-50 via-white to-blue-50 text-gray-800 min-h-screen flex flex-col font-sans">

    {{ template "header" }}

    <!-- Banner Carousel -->
    <div id="banners-container" 
         hx-get="/api/banners" 
         hx-trigger="load"
         hx-swap="innerHTML"
         class="w-full">
    </div>

    <!-- Main Content -->
    <main class="flex-1">
      <div class="text-center py-3">
        <em>
          <strong>Entregas em Campo Grande - MS podem incluir serviço de instalação!</strong> Basta inserir um CEP da cidade no endereço e confirmar
        </em>
      </div>
      <!-- Category Filters -->
      <section class="pb-8">
        <div class="container mx-auto px-4">
          <div class="glass rounded-2xl p-4 sm:p-6 shadow-sm">
            <h2 class="text-lg font-semibold text-gray-800 mb-4 hidden sm:block">Categorias</h2>

            <div class="flex flex-wrap justify-center gap-2 items-center" id="product-type-selection">
              <label for="category-select" class="text-sm font-medium text-gray-700">Categoria:</label>
              <select
                id="category-select"
                onchange="loadProducts()"
                class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm"
              >
                <option value="all" selected>Todos</option>
                <option value="ofertas">Ofertas</option>
              </select>
              <div hx-get="/api/categories/options" hx-trigger="load" hx-target="#category-select" hx-swap="beforeend"></div>
            </div>
          </div>
        </div>
      </section>
      
      <!-- Brand Filters -->
      <section class="pb-6">
        <div class="container mx-auto px-4">
          <div class="flex items-center gap-3 mb-3">
            <span class="text-sm font-medium text-gray-600">Marcas:</span>
            <button type="button" 
              id="clear-brands-btn"
              class="text-xs px-3 py-1.5 rounded-full bg-red-50 text-red-600 hover:bg-red-100 transition-colors duration-200 hidden"
              onclick="clearBrandFilters()">
              Limpar filtros
            </button>
          </div>
          <div id="brands-container" 
            class="flex flex-wrap gap-2"
            hx-get="/api/brands"
            hx-trigger="load"
            hx-target="#brands-container"
            hx-swap="innerHTML">
          </div>
        </div>
      </section>
      
      <!-- Products Section -->
      <section class="pb-12">
        <div class="container mx-auto px-4">
          <div class="flex justify-between items-center mb-6">
            <div>
              <h2 class="text-2xl font-bold text-gray-900">Nossos Produtos</h2>
              <p class="text-sm text-gray-500 mt-1">Escolha entre os melhores purificadores e bebedouros</p>
            </div>
            <div id="loading" class="htmx-indicator">
              <svg class="animate-spin h-6 w-6 text-teal-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            </div>
          </div>
          
          <div id="products-container"
            class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"
            hx-get="/products/all"
            hx-trigger="load"
            hx-target="#products-container"
            hx-swap="innerHTML"
            hx-indicator="#loading">
            <div class="col-span-full py-16 text-center">
              <div class="loading-shimmer h-64 rounded-2xl mb-4"></div>
              <p class="text-gray-500">Carregando produtos...</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    {{ template "footer" }}

    <div id="cart-container"></div>

    <script type="module" src="/static/js/cart.js"></script>
    <script>
      // Track selected brand IDs
      let selectedBrands = [];

      function getBrandQueryString() {
        if (selectedBrands.length === 0) return '';
        return '?brands=' + selectedBrands.join(',');
      }

      function loadProducts() {
        const category = document.getElementById('category-select').value;
        const brandParam = getBrandQueryString();
        const url = `/products/${category}${brandParam}`;
        htmx.ajax('GET', url, { target: '#products-container', swap: 'innerHTML', indicator: '#loading' });
      }

      function toggleBrandFilter(btn) {
        const brandId = parseInt(btn.getAttribute('data-brand-id'));

        if (selectedBrands.includes(brandId)) {
          selectedBrands = selectedBrands.filter(id => id !== brandId);
          btn.classList.remove('active');
        } else {
          selectedBrands.push(brandId);
          btn.classList.add('active');
        }

        const clearBtn = document.getElementById('clear-brands-btn');
        if (selectedBrands.length > 0) {
          clearBtn.classList.remove('hidden');
        } else {
          clearBtn.classList.add('hidden');
        }

        loadProducts();
      }

      function clearBrandFilters() {
        selectedBrands = [];

        document.querySelectorAll('.brand-pill').forEach(btn => {
          btn.classList.remove('active');
        });

        document.getElementById('clear-brands-btn').classList.add('hidden');

        loadProducts();
      }

      // Mobile menu functionality
      const mobileMenuBtn = document.getElementById('mobile-menu-btn');
      const mobileMenuClose = document.getElementById('mobile-menu-close');
      const mobileMenu = document.getElementById('mobile-menu');
      const mobileMenuOverlay = document.getElementById('mobile-menu-overlay');
      const menuIconOpen = document.getElementById('menu-icon-open');
      const menuIconClose = document.getElementById('menu-icon-close');

      function openMobileMenu() {
        mobileMenu.classList.remove('translate-x-full');
        mobileMenuOverlay.classList.remove('hidden');
        setTimeout(() => mobileMenuOverlay.classList.remove('opacity-0'), 10);
        mobileMenuBtn.setAttribute('aria-expanded', 'true');
        menuIconOpen.classList.add('hidden');
        menuIconClose.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }

      function closeMobileMenu() {
        mobileMenu.classList.add('translate-x-full');
        mobileMenuOverlay.classList.add('opacity-0');
        setTimeout(() => mobileMenuOverlay.classList.add('hidden'), 300);
        mobileMenuBtn.setAttribute('aria-expanded', 'false');
        menuIconOpen.classList.remove('hidden');
        menuIconClose.classList.add('hidden');
        document.body.style.overflow = '';
      }

      mobileMenuBtn.addEventListener('click', () => {
        if (mobileMenuBtn.getAttribute('aria-expanded') === 'false') {
          openMobileMenu();
        } else {
          closeMobileMenu();
        }
      });

      mobileMenuClose.addEventListener('click', closeMobileMenu);
      mobileMenuOverlay.addEventListener('click', closeMobileMenu);

      // Close mobile menu on escape key
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && mobileMenuBtn.getAttribute('aria-expanded') === 'true') {
          closeMobileMenu();
        }
      });

      // Search functionality: close dropdown when clicking outside
      document.addEventListener('click', function(e) {
        const searchContainer = document.getElementById('search-container');
        const searchResults = document.getElementById('search-results');
        if (searchContainer && searchResults && !searchContainer.contains(e.target)) {
          searchResults.classList.add('hidden');
        }
        
        const searchContainerMobile = document.getElementById('search-container-mobile');
        const searchResultsMobile = document.getElementById('search-results-mobile');
        if (searchContainerMobile && searchResultsMobile && !searchContainerMobile.contains(e.target)) {
          searchResultsMobile.classList.add('hidden');
        }
      });

      // Search functionality: close dropdown on ESC key
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          const searchResults = document.getElementById('search-results');
          const searchResultsMobile = document.getElementById('search-results-mobile');
          if (searchResults) searchResults.classList.add('hidden');
          if (searchResultsMobile) searchResultsMobile.classList.add('hidden');
        }
      });

      // Update cart badge
      function updateCartBadge() {
        const cart = JSON.parse(localStorage.getItem('cart') || '[]');
        const badge = document.getElementById('cart-badge');
        if (badge) {
          const totalItems = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
          badge.textContent = totalItems;
          if (totalItems > 0) {
            badge.classList.remove('opacity-0');
            badge.classList.add('cart-pulse');
            setTimeout(() => badge.classList.remove('cart-pulse'), 300);
          } else {
            badge.classList.add('opacity-0');
          }
        }
      }

      // Update cart badge on load and when storage changes
      updateCartBadge();
      window.addEventListener('storage', updateCartBadge);
    </script>
  </body>
</html>
