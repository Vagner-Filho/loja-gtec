<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuários - Loja G-TEC</title>
    <link href="/static/images/favicon.png" type="image/x-icon" rel="icon">
    <link href="/static/css/dist/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    {{ template "admin-header" . }}

    <main class="container mx-auto px-4 py-8">
      <!-- Add User Section -->
      <div class="bg-white rounded-lg shadow-md p-6 mb-8">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Cadastrar Novo Usuário</h2>

        <form id="add-user-form"
          class="grid grid-cols-1 md:grid-cols-3 gap-4"
          hx-post="/api/admin/users"
          hx-target="#user-form-message"
          hx-swap="innerHTML"
          hx-indicator="#add-loading"
          hx-on::after-request="if(event.detail.successful) this.reset();">
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Nome de usuário</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
              placeholder="e.g., joao.silva"
            >
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-2">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
              placeholder="e.g., joao@email.com"
            >
          </div>

          <div>
            <label for="cpf" class="block text-sm font-medium text-gray-700 mb-2">CPF</label>
            <input
              type="text"
              id="cpf"
              name="cpf"
              required
              maxlength="14"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
              placeholder="000.000.000-00"
            >
          </div>

          <div>
            <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Telefone</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
              placeholder="(00) 00000-0000"
            >
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
              placeholder="••••••••"
            >
          </div>

          <div>
            <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-2">Confirmar Senha</label>
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
              placeholder="••••••••"
            >
          </div>

          <div>
            <label for="role" class="block text-sm font-medium text-gray-700 mb-2">Função</label>
            <select
              id="role"
              name="role"
              required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
            >
              <option value="admin">Admin</option>
              <option value="product_admin">Gerente de Produto</option>
            </select>
          </div>

          <div class="md:col-span-3 flex items-center gap-4">
            <button
              type="submit"
              class="bg-green-600 text-white px-6 py-3 rounded-lg hover:bg-green-700 transition-colors font-semibold shadow-md hover:shadow-lg"
            >
              Cadastrar Usuário
            </button>
            <div id="add-loading" class="hidden htmx-indicator">
              <div class="flex items-center gap-2">
                <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-green-600"></div>
                <span class="text-green-600">Cadastrando...</span>
              </div>
            </div>
          </div>
        </form>

        <div id="user-form-message" class="mt-4"></div>
      </div>

      <!-- Users List -->
      <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Usuários Cadastrados</h2>

        <div id="users-list" class="space-y-4" hx-get="/api/admin/users" hx-trigger="load, refreshUsers from:body" hx-indicator="#users-loading">
          <!-- Users will be loaded here -->
        </div>

        <div id="users-loading" class="hidden htmx-indicator text-center py-4">
          <div class="flex items-center justify-center gap-2">
            <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-600"></div>
            <span class="text-blue-600">Carregando usuários...</span>
          </div>
        </div>
      </div>
    </main>

    <script src="/static/js/admin.js"></script>
    <script src="/static/js/toast.js"></script>
  </body>
</html>
