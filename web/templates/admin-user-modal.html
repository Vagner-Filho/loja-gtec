<dialog id="user-modal" class="m-auto bg-transparent backdrop:bg-black/50" hx-on="closeUserModal: this.close(); this.remove()">
  <div class="bg-white rounded-lg shadow-2xl max-w-md w-full mx-auto my-20 p-6">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-xl font-bold text-gray-800">Editar Usuário</h3>
      <button type="button" onclick="document.getElementById('user-modal').close(); document.getElementById('user-modal').remove();" class="text-gray-500 hover:text-gray-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    {{if .Error}}
      <div class="mb-4 text-sm text-red-600 bg-red-50 border border-red-200 rounded px-3 py-2">{{.Error}}</div>
    {{end}}

    <form id="edit-user-form" class="grid grid-cols-1 gap-4" hx-put="/api/admin/users/{{.Admin.ID}}">
      <div>
        <label for="edit-username" class="block text-sm font-medium text-gray-700 mb-2">Nome de usuário</label>
        <input
          type="text"
          id="edit-username"
          name="username"
          value="{{.Admin.Username}}"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
        >
      </div>

      <div>
        <label for="edit-email" class="block text-sm font-medium text-gray-700 mb-2">E-mail</label>
        <input
          type="email"
          id="edit-email"
          name="email"
          value="{{.Admin.Email}}"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
        >
      </div>

      <div>
        <label for="edit-cpf" class="block text-sm font-medium text-gray-700 mb-2">CPF</label>
        <input
          type="text"
          id="edit-cpf"
          name="cpf"
          value="{{.Admin.CPF}}"
          required
          maxlength="14"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
        >
      </div>

      <div>
        <label for="edit-phone" class="block text-sm font-medium text-gray-700 mb-2">Telefone</label>
        <input
          type="tel"
          id="edit-phone"
          name="phone"
          value="{{.Admin.Phone}}"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
        >
      </div>

      <div>
        <label for="edit-role" class="block text-sm font-medium text-gray-700 mb-2">Função</label>
        <select
          id="edit-role"
          name="role"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
        >
          <option value="admin" {{if eq .Admin.Role "admin"}}selected{{end}}>Admin</option>
          <option value="product_admin" {{if eq .Admin.Role "product_admin"}}selected{{end}}>Product Admin</option>
        </select>
      </div>

      <div class="flex items-center justify-between gap-4">
        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors font-semibold shadow-md hover:shadow-lg">
          Salvar Alterações
        </button>
        <button type="button" onclick="document.getElementById('user-modal').close(); document.getElementById('user-modal').remove();" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400 transition-colors font-semibold">
          Cancelar
        </button>
      </div>
    </form>

    <hr class="my-6 border-gray-200">

    <h4 class="text-lg font-bold text-gray-800 mb-4">Redefinir Senha</h4>

    <form id="edit-password-form" class="grid grid-cols-1 gap-4" hx-put="/api/admin/users/{{.Admin.ID}}/password" hx-target="#password-message" hx-swap="innerHTML">
      <div>
        <label for="edit-password" class="block text-sm font-medium text-gray-700 mb-2">Nova Senha</label>
        <input
          type="password"
          id="edit-password"
          name="password"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
        >
      </div>

      <div>
        <label for="edit-confirm-password" class="block text-sm font-medium text-gray-700 mb-2">Confirmar Nova Senha</label>
        <input
          type="password"
          id="edit-confirm-password"
          name="confirm_password"
          required
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
        >
      </div>

      <div class="flex items-center gap-4">
        <button type="submit" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition-colors font-semibold shadow-md hover:shadow-lg">
          Atualizar Senha
        </button>
      </div>

      <div id="password-message"></div>
    </form>
  </div>
</dialog>
